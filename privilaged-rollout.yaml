apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: app-template
  namespace: default
  labels:
    app: app-template
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-template
  strategy:
    canary:
      steps:
      - setWeight: 25
      - pause:
          duration: 20s
      - setWeight: 50
      - pause:
          duration: 20s
      - setWeight: 100
  template:
    metadata:
      labels:
        app: app-template
    spec:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app-template
        image: nginx:1.21
        ports:
        - containerPort: 8080
        env:
        - name: APP_NAME
          value: "Privilaged Demo App"
        - name: DEFAULT_CATEGORY
          value: ""
        - name: SAFE_MODE
          value: "false"
        - name: APP_VERSION
          value: "v1.0.0"
        - name: APP_COLOR
          value: "red"
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: false
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: app-template
  namespace: default
spec:
  selector:
    app: app-template
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
